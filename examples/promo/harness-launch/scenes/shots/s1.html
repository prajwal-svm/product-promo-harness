<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="lib/motion.js"></script>
    <script src="lib/stage.js"></script>
    <link rel="stylesheet" href="lib/finish.css" />
    <!-- The harness launch sting: one script in, a launch video out; open source. 10 s at 120 BPM, every move on an
         event from timing.json (so it stays on the beat if the music is re-measured). Neo-brutal neon lime on paper:
         black borders, hard offset shadows, filled click pulses; no blur, no outline rings. -->
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Serif"; src: url("assets/fonts/InstrumentSerif-Italic-latin.woff2") format("woff2"); font-style: italic; }
      @font-face { font-family: "Mono"; src: url("assets/fonts/jbmono-var-latin.woff2") format("woff2"); font-weight: 100 800; }
      :root { --paper: #f7f8f2; --lime: #b8ff2c; --lime2: #8fe000; --ink: #0a0a0a; --soft: #ecffc6; --grain: 0.03; }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--paper); }
      #root { position: relative; isolation: isolate; width: 100%; height: 100%; overflow: hidden; background: var(--paper);
        color: var(--ink); font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      .dots { position: absolute; inset: 0; background-image: radial-gradient(circle at 2px 2px, rgba(10,10,10,0.10) 2px, transparent 2.3px);
        background-size: 40px 40px; background-position: 6px 6px; }
      .abs { position: absolute; }
      .c { position: absolute; left: 0; top: 0; }
      /* flood discs: each is centred on its own (x, y) by its margins, and scales from 0 */
      .disc { position: absolute; border-radius: 50%; }
      /* the star logo: two crossed capsules */
      .star { position: absolute; left: 960px; top: 540px; width: 0; height: 0; }
      .star i { position: absolute; left: -64px; top: -190px; width: 128px; height: 380px; border-radius: 64px; background: var(--lime);
        border: 6px solid var(--ink); box-sizing: border-box; }
      .star i:nth-child(1) { transform: rotate(45deg); } .star i:nth-child(2) { transform: rotate(-45deg); }
      .star b { position: absolute; left: -46px; top: -46px; width: 92px; height: 92px; border-radius: 50%; background: var(--lime); }
      .spark { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); }
      .plus { position: absolute; width: 34px; height: 34px; }
      .plus:before, .plus:after { content: ""; position: absolute; background: var(--ink); border-radius: 3px; }
      .plus:before { left: 14px; top: 0; width: 6px; height: 34px; } .plus:after { left: 0; top: 14px; width: 34px; height: 6px; }
      /* kinetic type: one box per character, the final glyph and three noise glyphs stacked */
      .kt { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; font-weight: 850; letter-spacing: -0.045em; }
      .ch { position: relative; display: inline-block; }
      .ch > span { position: absolute; left: 0; top: 0; width: 100%; text-align: center; }
      .ch > span.f { position: relative; }
      .hl { position: relative; display: inline-block; }
      .hl { margin: 0 0.1em 0 0.08em; }
      .hl > em { position: absolute; left: -0.16em; right: -0.12em; top: 0.08em; bottom: -0.04em; background: var(--ink);
        border-radius: 0.2em; z-index: -1; transform-origin: 0 50%; }
      .hl .ch { color: var(--lime); }
      .star.dark i, .star.dark b { background: var(--ink); border-color: var(--ink); }
      .deco { position: absolute; }
      /* cards */
      .card { position: absolute; background: #fff; border: 5px solid var(--ink); border-radius: 30px; box-shadow: 0 14px 0 var(--ink); overflow: hidden; }
      .bar { position: absolute; left: 0; right: 0; top: 0; height: 64px; border-bottom: 4px solid var(--ink); display: flex; align-items: center; gap: 12px; padding: 0 26px; box-sizing: border-box; background: var(--soft); }
      .bar i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--ink); box-sizing: border-box; }
      .bar i:nth-child(1) { background: #ff6b6b; } .bar i:nth-child(2) { background: #ffd23f; } .bar i:nth-child(3) { background: var(--lime); }
      .bar b { margin-left: 14px; font-family: "Mono", monospace; font-weight: 700; font-size: 30px; }
      .code { position: absolute; left: 56px; top: 116px; font-family: "Mono", monospace; font-size: 52px; line-height: 1.5; font-weight: 600; white-space: pre; }
      .code .k { color: #6b7280; } .code .s { color: var(--ink); }
      .code .cur { display: inline-block; width: 0.55em; height: 1em; background: var(--ink); vertical-align: -0.12em; margin-left: 2px; }
      .btn { position: absolute; height: 96px; border-radius: 48px; background: var(--lime); border: 5px solid var(--ink); box-shadow: 0 8px 0 var(--ink);
        display: flex; align-items: center; gap: 14px; padding: 0 40px; box-sizing: border-box; font-size: 40px; font-weight: 800; white-space: nowrap; }
      .btn svg { width: 36px; height: 36px; }
      .pulse { position: absolute; width: 0; height: 0; }
      .pulse i { position: absolute; left: -160px; top: -160px; width: 320px; height: 320px; border-radius: 50%; background: var(--lime); }
      /* the jelly cursor */
      .cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 50; }
      .cursor .sq { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; }
      .cursor .sq i { position: absolute; inset: 0; border-radius: 50%; background: var(--ink); }
      .cursor .sq i:after { content: ""; position: absolute; left: 11px; top: 10px; width: 14px; height: 14px; border-radius: 50%; background: var(--lime); }
      /* timeline */
      .tl { position: absolute; left: 40px; right: 40px; top: 96px; bottom: 120px; }
      .row { position: absolute; left: 0; right: 0; height: 90px; }
      .row > b { position: absolute; left: 0; top: 24px; width: 250px; font-family: "Mono", monospace; font-size: 32px; font-weight: 800; letter-spacing: 0.04em; }
      .lane { position: absolute; left: 260px; right: 0; top: 6px; height: 78px; border-radius: 16px; background: #f1f2ec; overflow: hidden; }
      .clip { position: absolute; top: 6px; bottom: 6px; border-radius: 12px; border: 4px solid var(--ink); box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 14px; overflow: hidden; }
      .clip.v { background: var(--lime); } .clip.m { background: var(--ink); } .clip.x { background: #fff; } .clip.cp { background: #fff; font-family: "Mono", monospace; font-size: 27px; font-weight: 700; }
      .clip.v i { width: 7px; border-radius: 4px; background: var(--ink); }
      .clip.m i { width: 10px; height: 10px; border-radius: 50%; background: var(--lime); }
      .clip.x i { width: 26px; height: 26px; transform: rotate(45deg); background: var(--lime); border: 3px solid var(--ink); box-sizing: border-box; }
      .clip.cp span { padding: 2px 10px; border-radius: 8px; background: var(--soft); border: 2px solid var(--ink); }
      .ph { position: absolute; top: 86px; bottom: 150px; width: 6px; margin-left: -3px; background: var(--ink); border-radius: 3px; }
      .ph:before { content: ""; position: absolute; left: -13px; top: -14px; width: 32px; height: 32px; border-radius: 50%; background: var(--lime); border: 5px solid var(--ink); box-sizing: border-box; }
      .chip { position: absolute; height: 70px; border-radius: 35px; border: 4px solid var(--ink); background: #fff; box-shadow: 0 6px 0 var(--ink);
        display: flex; align-items: center; padding: 0 26px; font-family: "Mono", monospace; font-size: 32px; font-weight: 800; box-sizing: border-box; white-space: nowrap; }
      /* render bar and player */
      .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lime); border-right: 5px solid var(--ink); box-sizing: border-box; }
      .pct { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 54px; font-weight: 900; letter-spacing: -0.03em; }
      .frame { position: absolute; inset: 0; background-size: cover; background-position: center; }
      .badge { position: absolute; height: 74px; border-radius: 37px; background: var(--lime); border: 5px solid var(--ink); box-shadow: 0 8px 0 var(--ink);
        display: flex; align-items: center; gap: 12px; padding: 0 28px 0 18px; font-size: 34px; font-weight: 850; white-space: nowrap; box-sizing: border-box; }
      .badge svg { width: 40px; height: 40px; }
      .play { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: var(--lime); border: 5px solid var(--ink); box-sizing: border-box; display: grid; place-items: center; }
      /* end card */
      .sub { position: absolute; left: 0; right: 0; text-align: center; font-size: 64px; font-weight: 700; letter-spacing: -0.02em; }
      .sub em { font-family: "Serif", serif; font-style: italic; font-weight: 400; font-size: 1.18em; letter-spacing: -0.01em; }
      .repo { position: absolute; left: 50%; height: 84px; border-radius: 42px; background: var(--ink); color: var(--lime); display: flex; align-items: center; gap: 16px;
        padding: 0 38px; font-family: "Mono", monospace; font-size: 36px; font-weight: 700; white-space: nowrap; box-sizing: border-box; }
      .plabel { position: absolute; left: 0; right: 0; text-align: center; font-family: "Mono", monospace; font-size: 40px; font-weight: 800; letter-spacing: 0.02em; }
      .plabel b { background: var(--lime); border: 4px solid var(--ink); border-radius: 12px; padding: 2px 14px; }
      .repo svg { width: 40px; height: 40px; fill: var(--lime); }
      .repo b { color: #fff; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s1" data-start="0" data-duration="1" data-width="1920" data-height="1080" data-fps="60">
      <div class="dots"></div>
      <div id="flood1" class="c"></div>
      <div id="word1" class="kt" style="top:430px; font-size:196px"></div>
      <div id="flood2" class="c"></div>
      <div id="decor" class="c"></div>
      <div id="sparks" class="c"></div>
      <div id="scard" class="card" style="left:340px; top:190px; width:1240px; height:660px">
        <div class="bar"><i></i><i></i><i></i><b id="fname">launch.md</b></div>
        <div id="code" class="code"></div>
        <div id="tlv" class="tl"></div>
      </div>
      <div id="genPulse" class="pulse" style="left:1150px; top:747px"><i></i></div>
      <div id="gen" class="btn" style="left:1108px; top:699px"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="#0a0a0a"/></svg>Make the video</div>
      <div id="rendPulse" class="pulse" style="left:1250px; top:802px"><i></i></div>
      <div id="rend" class="btn" style="left:1110px; top:760px"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4.4h4.4" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Render</div>
      <div id="chips" class="c"></div>
      <div id="plabel" class="plabel" style="top:372px">rendering · <b>600 frames</b> · 60 fps</div>
      <div id="pbar" class="card" style="left:290px; top:470px; width:1340px; height:160px; border-radius:80px">
        <div id="pfill" class="fill"></div><div id="pct" class="pct">0%</div>
      </div>
      <div id="player" class="card" style="left:400px; top:180px; width:1120px; height:630px">
        <div id="frames"></div><div class="play"><svg viewBox="0 0 24 24" width="56" height="56"><path d="M8 5v14l11-7z" fill="#0a0a0a"/></svg></div>
      </div>
      <div id="done" class="badge" style="left:1270px; top:130px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#0a0a0a"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#b8ff2c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Rendered</div>
      <div id="flood3" class="c"></div>
      <div id="word2" class="kt" style="top:250px; font-size:228px"></div>
      <div id="sub" class="sub" style="top:540px">One script in. A launch video <em>out.</em></div>
      <div id="repo" class="repo" style="top:680px"><svg viewBox="0 0 24 24"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.42c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.38-3.88-1.38-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.77.11 3.06.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.26 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg><span id="repoT"></span></div>
      <div id="star" class="star"><div id="starSpin" class="c"><div id="starSq" class="c"><i></i><i></i><b></b></div></div></div>
      <div id="star2" class="star dark" style="top:128px"><div id="star2Spin" class="c"><i></i><i></i><b></b></div></div>
      <div id="cursor" class="cursor"><div id="curSq" class="sq"><i></i></div></div>
      <div class="finish" data-layout-ignore></div>
      <div class="finish-grain" data-layout-ignore></div>
    </div>
    <script>
      (async () => {
        const ID = "s1";
        // the repository the end card names (swap here if the public repo gets another name)
        const REPO = "prajwal-svm/product-promo-harness";
        try {
          const S = await PromoStage.load(ID);
          const M = PromoMotion;
          const tl = gsap.timeline({ paused: true });
          const $ = (id) => document.getElementById(id);
          const T = (id) => { const e = S.events.find((x) => x.id === id); if (!e) throw new Error("no event " + id); return e.t_local; };
          const snappy = M.ease("snappy"), playful = M.ease("playful"), heavy = M.ease("heavy"), soft = M.ease("default");
          const rnd = M.rng(2027);
          const NOISE = "#%&@$*+=?!<>/\\[]{}0123456789ABCDEFGHJKMNPQRSTUVWXYZ";

          // ---------- helpers ----------
          // a flood: discs of one colour, each centred on (x, y), grown from nothing in a short stagger (a liquid edge
          // without blur); r is the radius each needs to reach the far corner
          const flood = (host, color, cx, cy, t, n = 6, spread = 220) => {
            const far = (x, y) => Math.max(Math.hypot(x, y), Math.hypot(1920 - x, y), Math.hypot(x, 1080 - y), Math.hypot(1920 - x, 1080 - y));
            for (let i = 0; i < n; i++) {
              const a = (i / n) * Math.PI * 2 + rnd() * 0.6, d = i === 0 ? 0 : spread * (0.5 + rnd() * 0.6);
              const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d, r = far(x, y) + 40;
              const el = document.createElement("div");
              el.className = "disc"; el.style.cssText = `left:${x - r}px; top:${y - r}px; width:${2 * r}px; height:${2 * r}px; background:${color}`;
              host.appendChild(el);
              tl.fromTo(el, { scale: 0 }, { scale: 1, duration: 0.62 + rnd() * 0.12, ease: "power3.out" }, t + i * 0.035);
            }
          };
          // kinetic type: each character cycles through three noise glyphs, then lands; highlight wraps words marked
          const kinetic = (host, text, t, step = 0.034, hold = 0.046, hi = []) => {
            const words = text.split(" ");
            let k = 0;
            const all = [];
            words.forEach((w, wi) => {
              const wrap = document.createElement("span");
              if (hi.includes(wi)) { wrap.className = "hl"; const em = document.createElement("em"); wrap.appendChild(em); all.push(["hl", em]); }
              [...w].forEach((ch) => {
                const box = document.createElement("span"); box.className = "ch";
                const fin = document.createElement("span"); fin.className = "f"; fin.textContent = ch;
                box.appendChild(fin);
                const t0 = t + k * step;
                gsap.set(fin, { opacity: 0 });
                tl.set(fin, { opacity: 1 }, t0 + 3 * hold);
                for (let j = 0; j < 3; j++) {
                  const n = document.createElement("span"); n.textContent = NOISE[Math.floor(rnd() * NOISE.length)];
                  box.appendChild(n); gsap.set(n, { opacity: 0 });
                  tl.set(n, { opacity: 1 }, t0 + j * hold); tl.set(n, { opacity: 0 }, t0 + (j + 1) * hold);
                }
                tl.fromTo(box, { y: 60 }, { y: 0, duration: snappy.duration, ease: snappy }, t0);
                wrap.appendChild(box); k++;
              });
              host.appendChild(wrap);
              if (wi < words.length - 1) host.appendChild(document.createTextNode(" "));
            });
            all.forEach(([kind, em]) => tl.fromTo(em, { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "expo.out" }, t + k * step * 0.6));
            return t + k * step + 3 * hold;
          };
          // a press: the element dips and springs back, a filled lime pulse grows under it and fades
          const press = (el, pulse, t) => {
            tl.to(el, { scale: 0.93, duration: 0.07, ease: "power2.out" }, t);
            tl.to(el, { scale: 1, duration: 0.3, ease: "back.out(2.6)" }, t + 0.07);
            tl.fromTo(pulse.firstElementChild, { scale: 0, opacity: 0.55 }, { scale: 1, opacity: 0, duration: 0.55, ease: "power2.out" }, t);
          };
          // the jelly cursor: travels (power3.inOut), stretching along its path and settling (squash layer), then a click
          const cur = $("cursor"), curSq = $("curSq");
          let cx = 2080, cy = 1140, lastSq = -1;
          gsap.set(cur, { x: cx, y: cy }); gsap.set(curSq, { scaleX: 1, scaleY: 1, rotation: 0 });
          const travel = (x, y, t, dur) => {
            const ang = Math.atan2(y - cy, x - cx) * 180 / Math.PI;
            tl.to(cur, { x, y, duration: dur, ease: "power3.inOut" }, t);
            tl.set(curSq, { rotation: ang }, t);
            tl.to(curSq, { scaleX: 1.55, scaleY: 0.72, duration: dur * 0.45, ease: "power2.in" }, t);
            tl.to(curSq, { scaleX: 1, scaleY: 1, duration: dur * 0.55, ease: "back.out(2.4)" }, t + dur * 0.45);
            cx = x; cy = y;
          };
          const tap = (t) => {
            tl.to(curSq, { scaleX: 0.72, scaleY: 0.72, duration: 0.06, ease: "power2.out" }, t - 0.06);
            tl.to(curSq, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "back.out(2.6)" }, t);
          };

          // ---------- 0: the star pops (e-logo), sparks fly ----------
          const t0 = T("e-logo");
          const star = $("star"), spin = $("starSpin"), sq = $("starSq");
          tl.fromTo(star, { scale: 0 }, { scale: 1, duration: 0.62, ease: "back.out(2.2)" }, t0 + 0.02);
          tl.fromTo(spin, { rotation: -140 }, { rotation: 0, duration: soft.duration, ease: soft }, t0 + 0.02);
          tl.fromTo(sq, { scaleX: 1, scaleY: 1 }, { scaleX: 1.12, scaleY: 0.88, duration: 0.12, ease: "power2.out" }, t0 + 0.5);
          tl.to(sq, { scaleX: 1, scaleY: 1, duration: playful.duration * 0.6, ease: playful }, t0 + 0.62);
          const sparks = $("sparks");
          for (let i = 0; i < 12; i++) {
            const el = document.createElement("div"); el.className = i % 3 ? "spark" : "plus";
            if (i % 3) { const s = 12 + Math.floor(rnd() * 16); el.style.cssText = `left:${960 - s / 2}px; top:${540 - s / 2}px; width:${s}px; height:${s}px; ${i % 2 ? "background:#b8ff2c; border:4px solid #0a0a0a; box-sizing:border-box;" : ""}`; }
            else el.style.cssText = "left:943px; top:523px";
            sparks.appendChild(el);
            const a = (i / 12) * Math.PI * 2 + rnd() * 0.4, d = 300 + rnd() * 260;
            gsap.set(el, { opacity: 0 });
            tl.set(el, { opacity: 1 }, t0 + 0.08);
            tl.fromTo(el, { x: 0, y: 0, rotation: 0 }, { x: Math.cos(a) * d, y: Math.sin(a) * d, rotation: 180, duration: 0.8, ease: "expo.out" }, t0 + 0.08);
            tl.to(el, { opacity: 0, duration: 0.25 }, t0 + 0.72);
          }

          // ---------- 1: the star blooms into a lime flood (e-flood); "One script." scrambles in (e-word) ----------
          const tF = T("e-flood");
          tl.to(star, { scale: 7, duration: 0.5, ease: "power3.in" }, tF - 0.18);
          tl.set(star, { opacity: 0 }, tF + 0.34);
          flood($("flood1"), "#b8ff2c", 960, 540, tF, 7, 260);
          const w1 = $("word1");
          kinetic(w1, "One script.", T("e-word"), 0.036, 0.042, [1]);

          // drifting dots and plus marks on the paper scenes (in after the paper flood, under the lime one at the end)
          const decor = $("decor");
          [[120, 140, "d"], [1790, 120, "p"], [80, 560, "p"], [1840, 520, "d"], [210, 960, "d"], [1700, 980, "p"], [980, 70, "d"], [620, 1010, "p"]].forEach(([x, y, k], i) => {
            const el = document.createElement("div"); el.className = "deco " + (k === "d" ? "spark" : "plus");
            el.style.left = x + "px"; el.style.top = y + "px";
            if (k === "d") { el.style.cssText += "; width:26px; height:26px; background:#b8ff2c; border:5px solid #0a0a0a; box-sizing:border-box"; }
            decor.appendChild(el);
            tl.fromTo(el, { y: 0, rotation: 0 }, { y: (i % 2 ? -1 : 1) * 46, rotation: k === "p" ? 90 : 0, duration: 7.4, ease: "sine.inOut" }, 0.4);
          });
          gsap.set(decor, { opacity: 0 });
          tl.to(decor, { opacity: 1, duration: 0.3 }, T("e-wipe") + 0.3);

          // ---------- 2: paper floods back (e-wipe), the script card springs up, the script types (e-type) ----------
          const tW = T("e-wipe");
          tl.to(w1, { y: -160, scale: 0.6, opacity: 0, duration: 0.32, ease: "power3.in" }, tW - 0.12);
          flood($("flood2"), "#f7f8f2", 1580, 980, tW, 6, 240);
          const card = $("scard");
          gsap.set(card, { opacity: 0, y: 0 });
          tl.set(card, { opacity: 1 }, tW + 0.12);
          tl.fromTo(card, { y: 700, rotation: 6 }, { y: 0, rotation: 0, duration: snappy.duration, ease: snappy }, tW + 0.12);
          const LINES = [["k", "# launch.md"], ["s", "\"Writing a paper is hard.\""], ["s", "\"Meet the app that helps.\""]];
          const code = $("code");
          const tT = T("e-type");
          let ci = 0;
          LINES.forEach(([cls, text], li) => {
            const row = document.createElement("div"); row.className = cls;
            [...text].forEach((ch) => { const s = document.createElement("span"); s.textContent = ch; row.appendChild(s); gsap.set(s, { opacity: 0 }); tl.set(s, { opacity: 1 }, tT + ci * 0.012 + li * 0.08); ci++; });
            code.appendChild(row);
          });
          const caret = document.createElement("span"); caret.className = "cur"; code.lastElementChild.appendChild(caret);
          gsap.set(caret, { opacity: 0 });
          for (let b = 0; b < 4; b++) { tl.set(caret, { opacity: b % 2 ? 1 : 0 }, tT + 0.85 + b * 0.25); }
          const gen = $("gen");
          gsap.set(gen, { opacity: 0 });
          tl.set(gen, { opacity: 1 }, tW + 0.45);
          tl.fromTo(gen, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: playful.duration, ease: playful }, tW + 0.45);
          const tC = T("e-click");
          travel(1150, 747, tC - 0.7, 0.62);
          tap(tC);
          press(gen, $("genPulse"), tC);

          // ---------- 3: the card opens into the timeline (e-tracks); four tracks fill on the beat ----------
          const tK = T("e-tracks");
          tl.to(code, { y: -40, opacity: 0, duration: 0.2, ease: "power2.in" }, tK - 0.16);
          tl.to(gen, { scale: 0, duration: 0.18, ease: "power2.in" }, tK - 0.08);
          tl.to(card, { left: 140, top: 170, width: 1640, height: 700, duration: snappy.duration, ease: snappy }, tK);
          travel(1720, 1010, tK + 0.04, 0.5);
          tl.set($("fname"), { textContent: "timeline · 60 fps" }, tK);
          const tlv = $("tlv");
          const ROWS = [["VOICE", "v", "e-voice"], ["MUSIC", "m", "e-music"], ["SFX", "x", "e-sfx"], ["CAPTIONS", "cp", "e-caps"]];
          ROWS.forEach(([label, kind, ev], i) => {
            const row = document.createElement("div"); row.className = "row"; row.style.top = 30 + i * 108 + "px";
            row.innerHTML = `<b>${label}</b><div class="lane"></div>`;
            const lane = row.lastElementChild;
            const clip = document.createElement("div"); clip.className = "clip " + kind;
            const spans = { v: [0, 0.92], m: [0, 1], x: [0.04, 0.9], cp: [0.03, 0.95] }[kind];
            clip.style.left = spans[0] * 100 + "%"; clip.style.width = (spans[1] - spans[0]) * 100 + "%";
            if (kind === "v") for (let j = 0; j < 80; j++) { const b = document.createElement("i"); b.style.height = 8 + Math.floor(rnd() * 36) + "px"; clip.appendChild(b); }
            if (kind === "m") for (let j = 0; j < 46; j++) { const b = document.createElement("i"); b.style.marginRight = "14px"; clip.appendChild(b); }
            if (kind === "x") { clip.style.gap = "64px"; for (let j = 0; j < 16; j++) clip.appendChild(document.createElement("i")); }
            if (kind === "cp") { clip.style.gap = "14px"; ["One", "script", "in.", "A", "launch", "video", "out.", "Open", "source."].forEach((w) => { const s = document.createElement("span"); s.textContent = w; clip.appendChild(s); }); }
            lane.appendChild(clip); tlv.appendChild(row);
            gsap.set(row, { opacity: 0 });
            tl.set(row, { opacity: 1 }, tK + 0.12 + i * 0.05);
            tl.fromTo(row, { x: -60 }, { x: 0, duration: snappy.duration, ease: snappy }, tK + 0.12 + i * 0.05);
            tl.fromTo(clip, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.42, ease: "expo.out" }, T(ev));
          });
          const ph = document.createElement("div"); ph.className = "ph"; card.appendChild(ph);
          gsap.set(ph, { opacity: 0, left: 302 });
          tl.set(ph, { opacity: 1 }, tK + 0.3);
          tl.to(ph, { left: 1580, duration: 1.6, ease: "none" }, tK + 0.3);
          // stat chips land with the captions
          const chips = $("chips");
          [["AI voice", 980, 74], ["−14 LUFS", 1230, 74], ["60 fps", 1530, 74]].forEach(([txt, x, y], i) => {
            const c = document.createElement("div"); c.className = "chip"; c.textContent = txt; c.style.left = x + "px"; c.style.top = y + "px";
            chips.appendChild(c); gsap.set(c, { opacity: 0 });
            const at = T("e-caps") + 0.05 + i * 0.12;
            tl.set(c, { opacity: 1 }, at);
            tl.fromTo(c, { scale: 0, rotation: -12 }, { scale: 1, rotation: i % 2 ? 3 : -3, duration: playful.duration, ease: playful }, at);
          });

          // ---------- 4: Render (e-render); the timeline collapses into a progress bar; done (e-done) opens the player ----------
          const rend = $("rend");
          gsap.set(rend, { opacity: 0, left: 1460, top: 740 });
          tl.set(rend, { opacity: 1 }, tK + 0.4);
          tl.fromTo(rend, { scale: 0 }, { scale: 1, duration: playful.duration, ease: playful }, tK + 0.4);
          const tR = T("e-render");
          gsap.set($("rendPulse"), { left: 1520, top: 788 });
          travel(1520, 788, tR - 0.62, 0.55);
          tap(tR);
          press(rend, $("rendPulse"), tR);
          const pbar = $("pbar"), pfill = $("pfill"), pct = $("pct"), plabel = $("plabel");
          gsap.set([pbar, plabel], { opacity: 0 });
          tl.set(plabel, { opacity: 1 }, tR + 0.62);
          tl.fromTo(plabel, { y: 30 }, { y: 0, duration: snappy.duration, ease: snappy }, tR + 0.62);
          tl.to([card, chips, rend], { scale: 0.2, opacity: 0, duration: 0.24, ease: "power3.in" }, tR + 0.4);
          tl.set(pbar, { opacity: 1 }, tR + 0.56);
          tl.fromTo(pbar, { scaleX: 0.3, scaleY: 0.3 }, { scaleX: 1, scaleY: 1, duration: snappy.duration, ease: snappy }, tR + 0.56);
          travel(1980, 1150, tR + 0.34, 0.5);
          const tD = T("e-done");
          const prog = { v: 0 };
          tl.fromTo(pfill, { width: 0 }, { width: 1330, duration: tD - tR - 0.82, ease: "power2.inOut" }, tR + 0.72);
          tl.fromTo(prog, { v: 0 }, { v: 100, duration: tD - tR - 0.82, ease: "power2.inOut", onUpdate: () => { pct.textContent = Math.round(prog.v) + "%"; } }, tR + 0.72);
          const player = $("player"), frames = $("frames");
          ["f140", "f265", "f395", "f482"].forEach((f, i) => {
            const fr = document.createElement("div"); fr.className = "frame"; fr.style.backgroundImage = `url(assets/frames/${f}.jpg)`; frames.appendChild(fr);
            gsap.set(fr, { opacity: i ? 0 : 1 });
            if (i) tl.set(fr, { opacity: 1 }, tD + 0.2 + i * 0.25);
          });
          gsap.set(player, { opacity: 0 });
          tl.to(pbar, { scaleX: 1.12, scaleY: 0.2, opacity: 0, duration: 0.16, ease: "power2.in" }, tD - 0.04);
          tl.to(plabel, { y: -30, opacity: 0, duration: 0.16, ease: "power2.in" }, tD - 0.04);
          tl.set(player, { opacity: 1 }, tD + 0.08);
          tl.fromTo(player, { scaleX: 0.86, scaleY: 0.2 }, { scaleX: 1, scaleY: 1, duration: playful.duration, ease: playful }, tD + 0.08);
          const done = $("done");
          gsap.set(done, { opacity: 0 });
          tl.set(done, { opacity: 1 }, tD + 0.16);
          tl.fromTo(done, { scale: 0, rotation: -14 }, { scale: 1, rotation: 4, duration: playful.duration, ease: playful }, tD + 0.16);

          // ---------- 5: the lime flood again (e-flood2); "Open source." (e-end), the line and the repo (e-sub), the star (e-star) ----------
          const tF2 = T("e-flood2");
          flood($("flood3"), "#b8ff2c", 960, 500, tF2, 7, 280);
          kinetic($("word2"), "Open source.", T("e-end"), 0.034, 0.04, [0]);
          const sub = $("sub"), repo = $("repo"), tS = T("e-sub");
          gsap.set([sub, repo], { opacity: 0 });
          tl.set(sub, { opacity: 1 }, tS);
          tl.fromTo(sub, { y: 50 }, { y: 0, duration: snappy.duration, ease: snappy }, tS);
          $("repoT").innerHTML = `github.com/<b>${REPO}</b> · MIT`;
          tl.set(repo, { opacity: 1 }, tS + 0.18);
          tl.fromTo(repo, { xPercent: -50, scale: 0 }, { xPercent: -50, scale: 1, duration: playful.duration, ease: playful }, tS + 0.18);
          // the star returns small and black, top centre, and spins once
          const tSt = T("e-star"), star2 = $("star2");
          gsap.set(star2, { scale: 0 });
          tl.to(star2, { scale: 0.34, duration: playful.duration, ease: playful }, tSt);
          tl.fromTo($("star2Spin"), { rotation: -90 }, { rotation: 0, duration: 0.9, ease: "expo.out" }, tSt);
          // a little life in the hold: the headline breathes once
          tl.fromTo($("word2"), { scale: 1 }, { scale: 1.03, duration: 0.5, ease: "sine.inOut" }, tSt + 0.35);

          // every element a plain tl.to moves gets its start value at build time, so both seek orders write the same
          // inline style (promo verify)
          // (a fromTo's own start is its build value: plabel y 30, sub y 50, done scale 0)
          gsap.set([code, chips, w1, $("word2")], { x: 0, y: 0, scale: 1, rotation: 0 });
          gsap.set([code, chips, w1, star, star2, sub, repo], { opacity: 1 }); gsap.set([sub, repo], { opacity: 0 });
          gsap.set(plabel, { x: 0, y: 30 }); gsap.set(sub, { x: 0, y: 50 }); gsap.set(done, { scale: 0, rotation: -14 });
          gsap.set(card, { scale: 1, x: 0, left: 340, top: 190, width: 1240, height: 660 });
          gsap.set([gen, rend, pbar, player, repo, star, star2], { x: 0, y: 0, rotation: 0 });
          PromoStage.finish(tl, S);
          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
        } catch (e) {
          console.error("promo shot " + ID + " failed: " + e.message);
          throw e;
        }
      })();
    </script>
  </body>
</html>
