<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="lib/motion.js"></script>
    <script src="lib/stage.js"></script>
    <link rel="stylesheet" href="lib/finish.css" />
    <style>
      @font-face {
        font-family: "PromoDisplay";
        src: url("assets/fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
      }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg, #101114); }
      #root {
        position: relative; isolation: isolate; width: 100%; height: 100%; overflow: hidden;
        background: var(--bg, #101114); color: var(--ink, #f4f4f0);
        font-family: "PromoDisplay", system-ui, sans-serif;
      }
      .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .headline {
        margin: 0; max-width: 78%; text-align: center; font-weight: 600; letter-spacing: -0.02em;
        line-height: 1.05; font-size: var(--headline-px, 88px);
      }
      .headline .w { display: inline-block; white-space: pre; }
      .headline .key { color: var(--accent_text, var(--accent, #7cffb2)); }
      .card {
        position: absolute; left: 50%; top: 70%; width: 560px; height: 120px; margin-left: -280px;
        border-radius: 20px; background: var(--surface, #1b1d22); opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="{{SHOT_ID}}" data-start="0" data-duration="1" data-width="1920" data-height="1080" data-fps="60">
      <div class="stage"><h1 class="headline" id="headline" data-hero></h1></div>
      <div class="card" id="card"></div>
      <div class="finish" data-layout-ignore></div>
      <div class="finish-grain" data-layout-ignore></div>
    </div>
    <script>
      (async () => {
        const ID = "{{SHOT_ID}}";
        try {
          const S = await PromoStage.load(ID);
          const M = PromoMotion;
          const tl = gsap.timeline({ paused: true });
          const head = document.getElementById("headline");
          const mode = S.shot.text_mode;
          const key = S.chapter.headline && S.chapter.headline.key;
          if (mode === "verbatim-sync" && S.words.length) {
            const spans = PromoStage.splitWords(head, S.words.map((w) => w.text).join(" "), key);
            spans.forEach((span, i) => {
              const at = Math.max(0, S.words[i].t + S.lagS);
              tl.fromTo(span, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, at);
            });
          } else if (mode !== "none" && S.chapter.headline) {
            const spans = PromoStage.splitWords(head, S.chapter.headline.text, key);
            const first = PromoStage.eventsOf(S, "headline")[0];
            const start = first ? first.t_local : 0.15;
            const E = M.ease("heavy");
            spans.forEach((span, i) =>
              tl.fromTo(span, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: E.duration, ease: E }, start + i * 0.07));
          }
          const card = document.getElementById("card");
          const snappy = M.ease("snappy");
          for (const e of PromoStage.eventsOf(S, "card")) {
            tl.fromTo(card, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: snappy.duration, ease: snappy }, e.t_local);
          }
          for (const e of [...PromoStage.eventsOf(S, "click"), ...PromoStage.eventsOf(S, "tick")]) {
            tl.to(card, { scale: 0.96, duration: 0.06, ease: "power2.out" }, e.t_local);
            tl.to(card, { scale: 1, duration: snappy.duration, ease: snappy }, e.t_local + 0.06);
          }
          PromoStage.finish(tl, S);
          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
        } catch (e) {
          console.error("promo shot " + ID + " failed: " + e.message);
          throw e;
        }
      })();
    </script>
  </body>
</html>
